# No actions/* or third-party actions — compatible with org policies that only
# allow actions from repositories owned by this account.
# After the first successful run: Settings → Pages → Build and deployment →
# Source: Deploy from a branch → Branch: gh-pages → Folder: / (root)

name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git" repo

      - name: Install Node.js
        env:
          NODE_VERSION: "20.18.0"
        run: |
          set -euo pipefail
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" -o node.tar.xz
          tar -xJf node.tar.xz
          echo "${PWD}/node-v${NODE_VERSION}-linux-x64/bin" >> "$GITHUB_PATH"
          node --version
          npm --version

      - name: Install dependencies and build
        run: |
          set -euo pipefail
          cd repo/frontend
          npm ci
          npm run build

      - name: Publish to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd repo/frontend/dist
          touch .nojekyll
          git init
          git checkout -b gh-pages
          git add -A
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "Deploy GitHub Pages"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"
          git push -f origin gh-pages
